# Blueprint do Render: cria a API no plano gratuito.
# O banco fica no Neon, porque o Render permite um único banco grátis por conta.
# Segredos não ficam aqui: o JWT_SECRET é gerado pelo Render, e o endereço do banco e a senha inicial são digitados no painel.
services:
  - type: web
    name: helpdesk-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./BackEnd/Dockerfile
    dockerContext: ./BackEnd
    healthCheckPath: /health
    buildFilter:
      paths:
        - BackEnd/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: SEED_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
